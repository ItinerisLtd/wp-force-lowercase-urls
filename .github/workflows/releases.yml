name: Releases

on:
  push:
    tags:
      - "*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Get the version
        id: get_version
        run: echo ::set-output name=value::${GITHUB_REF/refs\/tags\//}

      - name: Setup the PHP 8.4 environment on ${{ runner.os }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          # Build with our minimum supported PHP version
          php-version: '8.4'
          coverage: xdebug

      - name: Build
        run: composer run-script release:build

      - name: Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          body: Version ${{ steps.get_version.outputs.value }}
          files: release/wp-force-lowercase-urls.zip
